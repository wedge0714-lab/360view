<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Awaji Model — 3D Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14181c;
    --panel: rgba(22, 27, 32, 0.82);
    --panel-border: rgba(255,255,255,0.08);
    --text: #e7e9ea;
    --text-dim: #8b939a;
    --accent: #6f95b8;
    --accent-hover: #86a9c8;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow: hidden;
  }
  #canvas-wrap{ position: fixed; inset: 0; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  #title{
    position:fixed; top:20px; left:20px;
    font-size: 13px; font-weight: 500; letter-spacing: 0.02em;
    color: var(--text-dim);
    pointer-events:none;
  }
  #title span{ color: var(--text); }

  #panel{
    position:fixed; bottom:20px; left:20px;
    display:flex; gap:6px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 6px;
    backdrop-filter: blur(10px);
  }
  #panel button{
    appearance:none; border:none; cursor:pointer;
    background: transparent;
    color: var(--text-dim);
    font-family: inherit; font-size: 12.5px; font-weight: 500;
    padding: 8px 12px; border-radius: 7px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  #panel button:hover{ background: rgba(255,255,255,0.06); color: var(--text); }
  #panel button.active{ background: var(--accent); color: #0d1114; }

  #hint{
    position:fixed; bottom:20px; right:20px;
    font-size: 12px; color: var(--text-dim);
    pointer-events:none;
  }

  #loading{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 16px;
    background: var(--bg);
    transition: opacity 0.4s ease;
    z-index: 10;
  }
  #loading.hidden{ opacity:0; pointer-events:none; }
  #loading-label{ font-size: 13px; color: var(--text-dim); letter-spacing: 0.02em; }
  #bar-track{ width: 220px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow:hidden; }
  #bar-fill{ width:0%; height:100%; background: var(--accent); transition: width 0.15s ease; }

  #error{
    position:fixed; inset:0; display:none;
    align-items:center; justify-content:center;
    background: var(--bg); z-index: 11;
    font-size: 13px; color: var(--text-dim); text-align:center; padding: 24px;
  }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div id="title">AWAJI <span>— 3D Model Viewer</span></div>

<div id="panel">
  <button id="btn-reset">視点リセット</button>
  <button id="btn-grid" class="active">グリッド</button>
  <button id="btn-wire">ワイヤーフレーム</button>
  <button id="btn-rotate">自動回転</button>
</div>

<div id="hint">ドラッグ: 回転　スクロール: ズーム　右ドラッグ: 平行移動</div>

<div id="loading">
  <div id="loading-label">モデルを読み込み中... 0%</div>
  <div id="bar-track"><div id="bar-fill"></div></div>
</div>

<div id="error">モデルの読み込みに失敗しました。ファイルパスをご確認ください。</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- config ----
const MODEL_URL = 'awaji_model-0915.fbx';

// ---- renderer / scene ----
const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14181c);
scene.fog = new THREE.Fog(0x14181c, 50, 400);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
camera.position.set(8, 6, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.1;
controls.maxDistance = 5000;

// ---- lighting ----
const hemi = new THREE.HemisphereLight(0xdfe8f0, 0x1a1d20, 1.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(50, 80, 40);
scene.add(key);

const fill = new THREE.DirectionalLight(0xaecdf0, 0.5);
fill.position.set(-60, 20, -40);
scene.add(fill);

// ---- ground grid ----
let grid = new THREE.GridHelper(100, 40, 0x3a4148, 0x24282d);
scene.add(grid);

// ---- state ----
let modelRoot = null;
let autoRotate = false;
let wireframeOn = false;

// ---- load ----
const loadingEl = document.getElementById('loading');
const loadingLabel = document.getElementById('loading-label');
const barFill = document.getElementById('bar-fill');
const errorEl = document.getElementById('error');

const loader = new FBXLoader();
loader.load(
  MODEL_URL,
  (object) => {
    modelRoot = object;

    object.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = false;
        child.receiveShadow = false;
        if (child.material) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach((m) => { if ('metalness' in m) m.metalness = Math.min(m.metalness ?? 0.3, 0.6); });
        }
      }
    });

    scene.add(object);
    frameObject(object);

    loadingEl.classList.add('hidden');
    setTimeout(() => { loadingEl.style.display = 'none'; }, 400);
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100);
      barFill.style.width = pct + '%';
      loadingLabel.textContent = `モデルを読み込み中... ${pct}%`;
    }
  },
  (err) => {
    console.error(err);
    loadingEl.style.display = 'none';
    errorEl.style.display = 'flex';
  }
);

function frameObject(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const fitDist = maxDim / (2 * Math.tan((Math.PI * camera.fov) / 360));
  const dist = fitDist * 1.6;

  camera.near = maxDim / 1000;
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();

  camera.position.set(center.x + dist * 0.6, center.y + dist * 0.45, center.z + dist * 0.6);
  controls.target.copy(center);
  controls.update();

  // resize grid to match model footprint
  scene.remove(grid);
  const gridSize = Math.max(maxDim * 2, 10);
  grid = new THREE.GridHelper(gridSize, 40, 0x3a4148, 0x24282d);
  grid.position.y = box.min.y;
  scene.add(grid);

  defaultCamPos = camera.position.clone();
  defaultTarget = controls.target.clone();
}

let defaultCamPos = camera.position.clone();
let defaultTarget = new THREE.Vector3();

// ---- UI ----
document.getElementById('btn-reset').addEventListener('click', () => {
  camera.position.copy(defaultCamPos);
  controls.target.copy(defaultTarget);
  controls.update();
});

document.getElementById('btn-grid').addEventListener('click', (e) => {
  grid.visible = !grid.visible;
  e.target.classList.toggle('active', grid.visible);
});

document.getElementById('btn-wire').addEventListener('click', (e) => {
  wireframeOn = !wireframeOn;
  e.target.classList.toggle('active', wireframeOn);
  if (modelRoot) {
    modelRoot.traverse((child) => {
      if (child.isMesh && child.material) {
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach((m) => { m.wireframe = wireframeOn; });
      }
    });
  }
});

document.getElementById('btn-rotate').addEventListener('click', (e) => {
  autoRotate = !autoRotate;
  e.target.classList.toggle('active', autoRotate);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- render loop ----
function animate() {
  requestAnimationFrame(animate);
  if (autoRotate && modelRoot) {
    modelRoot.rotation.y += 0.0035;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
