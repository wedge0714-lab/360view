<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Awaji Model — 3D Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #3a3d42;
    --panel: rgba(22, 27, 32, 0.82);
    --panel-border: rgba(255,255,255,0.08);
    --text: #e7e9ea;
    --text-dim: #8b939a;
    --accent: #6f95b8;
    --accent-hover: #86a9c8;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow: hidden;
  }
  #canvas-wrap{ position: fixed; inset: 0; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  #title{
    position:fixed; top:20px; left:20px;
    font-size: 13px; font-weight: 500; letter-spacing: 0.02em;
    color: var(--text-dim);
    pointer-events:none;
  }
  #title span{ color: var(--text); }

  #panel{
    position:fixed; bottom:20px; left:20px;
    display:flex; flex-wrap:wrap; gap:6px;
    max-width: calc(100vw - 40px);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 6px;
    backdrop-filter: blur(10px);
  }
  #panel button{
    appearance:none; border:none; cursor:pointer;
    background: transparent;
    color: var(--text-dim);
    font-family: inherit; font-size: 12.5px; font-weight: 500;
    padding: 8px 12px; border-radius: 7px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  #panel button:hover{ background: rgba(255,255,255,0.06); color: var(--text); }
  #panel button.active{ background: var(--accent); color: #0d1114; }

  #hint{
    position:fixed; bottom:44px; right:20px;
    font-size: 12px; color: var(--text-dim);
    pointer-events:none;
  }

  #brand{
    position:fixed; bottom:18px; right:20px;
    font-size: 11.5px; letter-spacing: 0.03em;
    color: var(--text-dim);
    text-decoration: none;
    opacity: 0.75;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  #brand:hover{ opacity: 1; color: var(--accent-hover); }

  #loading{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 16px;
    background: var(--bg);
    transition: opacity 0.4s ease;
    z-index: 10;
  }
  #loading.hidden{ opacity:0; pointer-events:none; }
  #loading-label{ font-size: 13px; color: var(--text-dim); letter-spacing: 0.02em; }
  #bar-track{ width: 220px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow:hidden; }
  #bar-fill{ width:0%; height:100%; background: var(--accent); transition: width 0.15s ease; }

  #error{
    position:fixed; inset:0; display:none;
    align-items:center; justify-content:center;
    background: var(--bg); z-index: 11;
    font-size: 13px; color: var(--text-dim); text-align:center; padding: 24px;
  }

  #debug{
    position:fixed; top:20px; right:20px;
    font-size: 11.5px; line-height: 1.6; color: var(--text-dim);
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 10px 12px;
    white-space: pre; pointer-events:none;
  }
  #debug:empty{ display:none; }

  #adjust-panel{
    position:fixed; top:56px; left:20px;
    width: 190px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px;
    backdrop-filter: blur(10px);
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .adjust-title{
    font-size: 11px; font-weight: 500; letter-spacing: 0.04em;
    color: var(--text-dim); margin-bottom: 8px;
  }
  .axis-row{
    display:flex; align-items:center; gap:6px; margin-bottom:6px;
  }
  .axis-row span{ width: 12px; color: var(--text); font-weight:600; }
  .axis-row button{
    flex:1; appearance:none; border:none; cursor:pointer;
    background: rgba(255,255,255,0.06); color: var(--text-dim);
    font-family: inherit; font-size: 13px; padding: 5px 0; border-radius: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .axis-row button:hover{ background: rgba(255,255,255,0.14); color: var(--text); }

  .adjust-divider{ height:1px; background: var(--panel-border); margin: 10px 0; }

  .seg-toggle{ display:flex; gap:4px; }
  .seg-toggle button{
    flex:1; appearance:none; border:none; cursor:pointer;
    background: rgba(255,255,255,0.06); color: var(--text-dim);
    font-family: inherit; font-size: 12px; font-weight:500;
    padding: 7px 0; border-radius: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .seg-toggle button.active{ background: var(--accent); color: #0d1114; }

  .fov-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .fov-row span{ color: var(--text); }
  #fov-slider{ width:100%; accent-color: var(--accent); }
  #wire-width{ width:100%; accent-color: var(--accent); }
  #wire-color{
    width: 32px; height: 22px; padding:0; border:none; border-radius:5px;
    background: none; cursor:pointer;
  }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div id="title">AWAJI <span>— 3D Model Viewer</span></div>

<div id="panel">
  <button id="btn-reset">視点リセット</button>
  <button id="btn-front">正面</button>
  <button id="btn-top">上面</button>
  <button id="btn-bottom">下面</button>
  <button id="btn-left">左面</button>
  <button id="btn-right">右面</button>
  <button id="btn-grid" class="active">グリッド</button>
  <button id="btn-wire">ワイヤーフレーム</button>
  <button id="btn-pivot" class="active">ピボット</button>
</div>

<div id="adjust-panel">
  <div class="adjust-title">モデルの傾き調整</div>
  <div class="axis-row">
    <span>X</span>
    <button data-axis="x" data-dir="1">◀</button>
    <button data-axis="x" data-dir="-1">▶</button>
  </div>
  <div class="axis-row">
    <span>Y</span>
    <button data-axis="y" data-dir="1">◀</button>
    <button data-axis="y" data-dir="-1">▶</button>
  </div>
  <div class="axis-row">
    <span>Z</span>
    <button data-axis="z" data-dir="1">◀</button>
    <button data-axis="z" data-dir="-1">▶</button>
  </div>

  <div class="adjust-divider"></div>
  <div class="adjust-title">表示モード</div>
  <div class="seg-toggle">
    <button id="btn-pbr" class="active">PBR</button>
    <button id="btn-matcap">Matcap</button>
  </div>

  <div class="adjust-divider"></div>
  <div class="fov-row">
    <span class="adjust-title" style="margin-bottom:0;">画角</span>
    <span id="fov-value">45°</span>
  </div>
  <input id="fov-slider" type="range" min="15" max="100" value="45" step="1">

  <div class="adjust-divider"></div>
  <div class="fov-row">
    <span class="adjust-title" style="margin-bottom:0;">ワイヤーフレーム色</span>
    <input id="wire-color" type="color" value="#ff5555">
  </div>
  <div class="fov-row">
    <span>太さ</span>
    <span id="wire-width-value">2px</span>
  </div>
  <input id="wire-width" type="range" min="1" max="6" value="2" step="0.5">
</div>

<div id="hint">ドラッグ: 回転　スクロール: ズーム　右ドラッグ: 平行移動</div>

<a id="brand" href="https://www.kewbu.com/" target="_blank" rel="noopener">KEWBU.Inc</a>

<div id="debug"></div>

<div id="loading">
  <div id="loading-label">モデルを読み込み中... 0%</div>
  <div id="bar-track"><div id="bar-fill"></div></div>
</div>

<div id="error">モデルの読み込みに失敗しました。ファイルパスをご確認ください。</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

// ---- config ----
const MODEL_URL = 'awaji_model-0915.fbx';

// ---- renderer / scene ----
const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a3d42);
scene.fog = new THREE.Fog(0x3a3d42, 50, 400);

// PBR-style materials (metalness/roughness workflow) need an environment map
// to reflect, otherwise they render near-black under only direct lights.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
camera.position.set(8, 6, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.1;
controls.maxDistance = 5000;

// ---- lighting ----
const hemi = new THREE.HemisphereLight(0xdfe8f0, 0x1a1d20, 1.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(50, 80, 40);
scene.add(key);

const fill = new THREE.DirectionalLight(0xaecdf0, 0.5);
fill.position.set(-60, 20, -40);
scene.add(fill);

// ---- ground grid ----
let grid = new THREE.GridHelper(100, 40, 0x6a6f76, 0x45484d);
scene.add(grid);

// ---- pivot marker: shows exactly where the camera orbits around, so
// dragging never feels like it's spinning around an invisible point ----
const pivotMarker = new THREE.AxesHelper(1);
pivotMarker.material.depthTest = false;
pivotMarker.material.transparent = true;
pivotMarker.renderOrder = 999;
scene.add(pivotMarker);

// ---- matcap renderer mode: a flat, lighting-independent clay look for
// judging pure shape, same idea as Sketchfab's PBR/Matcap toggle ----
function createMatcapTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size * 0.35, size * 0.32, size * 0.02, size * 0.5, size * 0.5, size * 0.62);
  grad.addColorStop(0, '#f4f4f4');
  grad.addColorStop(0.35, '#cfcfcf');
  grad.addColorStop(0.7, '#8d8d8d');
  grad.addColorStop(1, '#4c4c4c');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
  ctx.fill();
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const matcapMaterial = new THREE.MeshMatcapMaterial({
  matcap: createMatcapTexture(),
  side: THREE.DoubleSide,
  polygonOffset: true,
  polygonOffsetFactor: 1,
  polygonOffsetUnits: 1,
});

// ---- wireframe overlay: drawn as a separate "fat line" mesh on top of the
// solid surface, rather than switching material.wireframe (which hides the
// shaded faces entirely). One shared material means the color/width
// controls update every mesh's overlay at once. ----
const wireMaterial = new LineMaterial({ color: 0xff5555, linewidth: 2, transparent: true });
wireMaterial.resolution.set(window.innerWidth, window.innerHeight);
const wireOverlays = [];

function setRenderMode(mode) {
  if (!modelRoot) return;
  modelRoot.traverse((child) => {
    if (!child.isMesh) return;
    if (mode === 'matcap') {
      if (!child.userData._origMaterial) child.userData._origMaterial = child.material;
      child.material = matcapMaterial;
    } else if (child.userData._origMaterial) {
      child.material = child.userData._origMaterial;
    }
  });
  document.getElementById('btn-pbr').classList.toggle('active', mode === 'pbr');
  document.getElementById('btn-matcap').classList.toggle('active', mode === 'matcap');
}

// ---- state ----
let modelRoot = null;
let pivot = null;
let wireframeOn = false;

// ---- load ----
const loadingEl = document.getElementById('loading');
const loadingLabel = document.getElementById('loading-label');
const barFill = document.getElementById('bar-fill');
const errorEl = document.getElementById('error');

const loader = new FBXLoader();
const debugEl = document.getElementById('debug');

loader.load(
  MODEL_URL,
  (object) => {
    modelRoot = object;

    let meshCount = 0;
    try {
      object.traverse((child) => {
      if (child.isMesh) {
        meshCount++;
        child.castShadow = false;
        child.receiveShadow = false;
        // this whole block is cosmetic (materials/wireframe overlay) — if any
        // one mesh's data trips it up, skip that mesh rather than losing the
        // entire model (a thrown error here gets funneled into the loader's
        // onError, which shows the generic "failed to load" message even
        // though the FBX itself parsed fine).
        try {
          if (child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach((m) => {
              if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
              if (m.emissiveMap) m.emissiveMap.colorSpace = THREE.SRGBColorSpace;
              m.side = THREE.DoubleSide;
              // pushes the filled faces back very slightly so the wireframe
              // overlay (drawn at the true surface depth) doesn't flicker
              // against them (z-fighting)
              m.polygonOffset = true;
              m.polygonOffsetFactor = 1;
              m.polygonOffsetUnits = 1;
              m.needsUpdate = true;
            });
          }

          if (child.geometry && child.geometry.attributes && child.geometry.attributes.position) {
            const wireGeom = new THREE.WireframeGeometry(child.geometry);
            const posArray = wireGeom.attributes.position.array;
            if (posArray && posArray.length >= 6) {
              const lsg = new LineSegmentsGeometry();
              lsg.setPositions(posArray);
              const overlay = new LineSegments2(lsg, wireMaterial);
              overlay.visible = wireframeOn;
              child.add(overlay);
              wireOverlays.push(overlay);
            }
            wireGeom.dispose();
          }
        } catch (err) {
          console.warn('Skipped wireframe/material setup for one mesh:', err);
        }
      }
      });
    } catch (err) {
      console.warn('Mesh traversal error (continuing with what loaded):', err);
    }

    scene.add(object);

    // FBX root objects are usually at world origin, but the mesh data
    // inside can sit anywhere (this model's vertices are ~1,000,000 units
    // from the origin). Rotating "object" directly would spin it around
    // that origin, flinging the geometry far off-screen. Wrapping it in a
    // pivot centered on its own bounding box makes rotation happen around
    // the model itself.
    let info = null;
    try {
      const rawBox = new THREE.Box3().setFromObject(object);
      const rawCenter = new THREE.Vector3();
      if (!rawBox.isEmpty() && isFinite(rawBox.min.x)) rawBox.getCenter(rawCenter);

      scene.remove(object);
      object.position.sub(rawCenter);
      pivot = new THREE.Group();
      pivot.position.copy(rawCenter);
      pivot.add(object);
      scene.add(pivot);

      info = setupSceneScale(pivot);

      // bright outline around the model's bounds — visible even if the
      // model's own materials fail to render, so we can tell the two
      // problems apart at a glance.
      if (info) {
        const helperBox = new THREE.Box3Helper(info.box, new THREE.Color(0xff5555));
        scene.add(helperBox);
      }

      frameToView('front');
    } catch (err) {
      console.warn('Framing/pivot setup error:', err);
    }

    debugEl.textContent =
      `メッシュ数: ${meshCount}\n` +
      (info
        ? `サイズ: ${info.size.x.toFixed(2)} x ${info.size.y.toFixed(2)} x ${info.size.z.toFixed(2)}\n` +
          `中心: (${info.center.x.toFixed(2)}, ${info.center.y.toFixed(2)}, ${info.center.z.toFixed(2)})`
        : `境界ボックス: 計算できませんでした`) +
      (meshCount === 0 ? `\n※ジオメトリが1つも見つかりませんでした` : '');

    loadingEl.classList.add('hidden');
    setTimeout(() => { loadingEl.style.display = 'none'; }, 400);
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100);
      barFill.style.width = pct + '%';
      loadingLabel.textContent = `モデルを読み込み中... ${pct}%`;
    }
  },
  (err) => {
    console.error(err);
    loadingEl.style.display = 'none';
    errorEl.style.display = 'flex';
  }
);

// one-time setup: fog / clipping planes / ground grid all scale with the
// model's own size, since a fixed value that works for a chair looks wrong
// for a 600m site model (and vice versa).
function setupSceneScale(object) {
  const box = new THREE.Box3().setFromObject(object);

  if (box.isEmpty() || !isFinite(box.min.x) || !isFinite(box.max.x)) {
    console.warn('FBX bounding box could not be computed.');
    return null;
  }

  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;

  camera.near = Math.max(maxDim / 1000, 0.001);
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();

  controls.minDistance = Math.max(maxDim / 1000, 0.01);
  controls.maxDistance = Math.max(maxDim * 20, 5000);
  scene.fog.near = maxDim * 0.6;
  scene.fog.far = maxDim * 6;

  scene.remove(grid);
  const gridSize = Math.max(maxDim * 2, 10);
  grid = new THREE.GridHelper(gridSize, 40, 0x6a6f76, 0x45484d);
  grid.position.y = box.min.y;
  scene.add(grid);

  pivotMarker.scale.setScalar(maxDim * 0.06);

  return { box, size, center, maxDim };
}

// camera navigation: always recomputed live from the model's current
// bounding box, so it can't drift out of sync with a stored value.
function frameToView(mode) {
  if (!pivot) return;
  const box = new THREE.Box3().setFromObject(pivot);
  if (box.isEmpty()) return;

  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const fitDist = (maxDim / (2 * Math.tan((Math.PI * camera.fov) / 360))) * 1.6;

  let pos;

  switch (mode) {
    case 'front':
      pos = new THREE.Vector3(center.x, center.y, center.z + fitDist);
      break;
    case 'right':
      pos = new THREE.Vector3(center.x + fitDist, center.y, center.z);
      break;
    case 'left':
      pos = new THREE.Vector3(center.x - fitDist, center.y, center.z);
      break;
    case 'top':
      // OrbitControls fixes its internal up-vector basis once, at
      // construction — it does not track later changes to camera.up. A
      // camera placed exactly on the up-axis is also a singular case for
      // its orbit math. A tiny horizontal nudge keeps camera.up untouched
      // (so dragging keeps working afterwards) while avoiding that case.
      pos = new THREE.Vector3(center.x + fitDist * 0.001, center.y + fitDist, center.z);
      break;
    case 'bottom':
      pos = new THREE.Vector3(center.x + fitDist * 0.001, center.y - fitDist, center.z);
      break;
    case 'iso':
      pos = new THREE.Vector3(center.x + fitDist * 0.6, center.y + fitDist * 0.45, center.z + fitDist * 0.6);
      break;
    default:
      pos = new THREE.Vector3(center.x, center.y, center.z + fitDist);
      break;
  }

  camera.position.copy(pos);
  controls.target.copy(center);
  controls.update();
}

// ---- UI ----
document.getElementById('btn-reset').addEventListener('click', () => frameToView('front'));
document.getElementById('btn-front').addEventListener('click', () => frameToView('front'));
document.getElementById('btn-top').addEventListener('click', () => frameToView('top'));
document.getElementById('btn-bottom').addEventListener('click', () => frameToView('bottom'));
document.getElementById('btn-left').addEventListener('click', () => frameToView('left'));
document.getElementById('btn-right').addEventListener('click', () => frameToView('right'));

document.getElementById('btn-grid').addEventListener('click', (e) => {
  grid.visible = !grid.visible;
  e.target.classList.toggle('active', grid.visible);
});

document.getElementById('btn-wire').addEventListener('click', (e) => {
  wireframeOn = !wireframeOn;
  e.target.classList.toggle('active', wireframeOn);
  wireOverlays.forEach((o) => { o.visible = wireframeOn; });
});

document.getElementById('btn-pivot').addEventListener('click', (e) => {
  pivotMarker.visible = !pivotMarker.visible;
  e.target.classList.toggle('active', pivotMarker.visible);
});

// straighten model: small nudges per axis, same idea as Sketchfab's
// "Straighten model" X/Y/Z arrows
const STRAIGHTEN_STEP = THREE.MathUtils.degToRad(5);
document.querySelectorAll('.axis-row button').forEach((btn) => {
  btn.addEventListener('click', () => {
    if (!pivot) return;
    const axis = btn.dataset.axis;
    const dir = parseFloat(btn.dataset.dir);
    pivot.rotation[axis] += STRAIGHTEN_STEP * dir;
  });
});

document.getElementById('btn-pbr').addEventListener('click', () => setRenderMode('pbr'));
document.getElementById('btn-matcap').addEventListener('click', () => setRenderMode('matcap'));

const fovSlider = document.getElementById('fov-slider');
const fovValue = document.getElementById('fov-value');
fovSlider.addEventListener('input', (e) => {
  const val = parseFloat(e.target.value);
  camera.fov = val;
  camera.updateProjectionMatrix();
  fovValue.textContent = val + '°';
});

document.getElementById('wire-color').addEventListener('input', (e) => {
  wireMaterial.color.set(e.target.value);
});

const wireWidthValue = document.getElementById('wire-width-value');
document.getElementById('wire-width').addEventListener('input', (e) => {
  const val = parseFloat(e.target.value);
  wireMaterial.linewidth = val;
  wireWidthValue.textContent = val + 'px';
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  wireMaterial.resolution.set(window.innerWidth, window.innerHeight);
});

// ---- render loop ----
function animate() {
  requestAnimationFrame(animate);
  pivotMarker.position.copy(controls.target);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
